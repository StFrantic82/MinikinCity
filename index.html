<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minikin City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a cosy tabletop, playful and warm, never noisy
   IDEA: the game table seen from above — a felt mat with the card row, the market and each tiny city
   PICTURE: the real card art of Minikin City, laid out like a table in play
   COLOUR and TYPE: warm paper ground, the three card colours as accents (pink, green, blue); Fredoka titles, Nunito text
   LAYOUT: year row on top, table centre, your city and hand at the bottom, opponents to the side, log at the edge */
:root{color-scheme:light dark;
  --bg:light-dark(#f5ede4,#1d1916);--felt:light-dark(#efe3d5,#272220);--card:light-dark(#fffaf4,#2f2926);
  --ink:light-dark(#3a2622,#f3e6dc);--soft:light-dark(#7a645c,#bfa99d);--line:light-dark(#e2d2c3,#433833);
  --pink:#ee7aa0;--green:#86c040;--blue:#62a8dc;--sun:#f4c84a;--accent:#d9572f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.ttl{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font:700 15px Nunito,sans-serif;border:0;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--ink);color:var(--bg)}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
button:focus-visible,.cardbox:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
/* écran de lancement */
#setup{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,#fbe7a5 0,transparent 40%),radial-gradient(circle at 15% 80%,#cfe8b0 0,transparent 45%),radial-gradient(circle at 90% 90%,#bcdcf4 0,transparent 40%),var(--bg)}
.setupcard{background:var(--card);border-radius:28px;padding:clamp(22px,4vw,40px);width:min(560px,100%);box-shadow:0 20px 60px rgba(60,30,20,.18)}
.logo{font-family:Fredoka;font-weight:700;font-size:clamp(40px,8vw,60px);line-height:1;color:#4a2b25;text-shadow:3px 3px 0 #fff,-1px -1px 0 #fff}
:root[data-theme=dark] .logo{color:#f6d9c7;text-shadow:3px 3px 0 #000}
.fan{display:flex;justify-content:center;margin:18px 0 8px;height:120px}
.fan img{width:78px;border-radius:9px;box-shadow:0 6px 14px rgba(0,0,0,.2);margin:0 -14px}
.field{margin:18px 0}.field>label.h{display:block;font-weight:800;margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:52px}.seg button[aria-pressed=false]{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
input[type=text]{font:16px Nunito;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:44px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:2px solid var(--line);margin-bottom:8px;cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.check b{display:block}.check span{color:var(--soft);font-size:14px}
/* table de jeu */
#game{display:none;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:10px max(2vw,12px);background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .logo{font-size:26px;text-shadow:2px 2px 0 #fff}
.status{flex:1;font-weight:700}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;padding:14px max(2vw,12px)}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}}
.year{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;background:var(--felt);border-radius:18px;padding:10px}
.ycol{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;border-radius:12px;padding:4px}
.ycol.now{background:light-dark(#fff6d6,#3d3420);box-shadow:0 0 0 2px var(--sun)}
.ycol .n{font-family:Fredoka;font-size:13px;color:var(--soft)}
.fest{width:100%;aspect-ratio:1;border-radius:8%;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.rcard{position:relative;width:100%}
.rcard img{width:100%;display:block;border-radius:7%;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.rcard img.tile{position:absolute;left:50%;top:50%;width:150%;transform:translate(-50%,-50%) rotate(90deg);border-radius:6px}
.mk{position:absolute;width:14%;aspect-ratio:1;border-radius:50%;border:2px solid #3a2622;transform:translate(-50%,-50%);left:13.6%}
.mid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media(max-width:700px){.mid{grid-template-columns:minmax(0,1fr)}.year{grid-template-columns:repeat(5,minmax(0,1fr))}}
.zone{background:var(--card);border-radius:18px;padding:12px 14px;border:2px solid var(--line)}
.zone h3{font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zone h3 small{font-family:Nunito;font-weight:600;font-size:13px;color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.cardbox{position:relative;width:96px;flex:none;border-radius:9px;transition:transform .15s}
.cardbox img{width:100%;aspect-ratio:240/396;object-fit:cover;border-radius:9px;display:block;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.cardbox.sm{width:66px}.cardbox.lg{width:118px}
.cardbox.click{cursor:pointer}.cardbox.click:hover{transform:translateY(-6px)}
.cardbox.click img{box-shadow:0 0 0 3px var(--sun),0 6px 14px rgba(0,0,0,.25)}
.cardbox.sel img{box-shadow:0 0 0 4px var(--accent),0 6px 14px rgba(0,0,0,.25)}.cardbox.sel{transform:translateY(-10px)}
.cardbox .who{position:absolute;left:4px;right:4px;bottom:-20px;text-align:center;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardbox .rk{position:absolute;top:-8px;right:-8px;background:var(--ink);color:var(--bg);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font:700 13px Fredoka}
.cardbox .ev{position:absolute;top:-8px;left:-8px;background:var(--sun);color:#3a2622;border-radius:9px;padding:0 6px;font:700 12px Fredoka;height:22px;display:grid;place-items:center}
.minis{position:absolute;left:50%;bottom:31%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(255,255,255,.92);border-radius:10px;padding:2px 5px}
.minis i{width:9px;height:9px;border-radius:50%;border:1.5px solid #3a2622;display:block}.minis i.f{background:#6f9f2d}
.cardbox.done .minis{background:#e8f6d4}
.plays{min-height:170px;padding-bottom:22px}
.prompt{margin-top:14px;background:light-dark(#fff3c8,#3b3218);border:2px solid var(--sun);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prompt .q{flex:1;font-weight:800;min-width:200px}
.prompt:empty{display:none}
.me{margin-top:14px}
.tokens{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tok{display:inline-flex;align-items:center;gap:4px;background:var(--felt);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:700}
.tok img{height:20px}
.ico{height:18px;vertical-align:-4px}
.opps{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.opp .row{gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px}.dot{width:14px;height:14px;border-radius:50%;border:2px solid #3a2622;display:inline-block}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--soft);font-weight:700;margin-bottom:6px}
.side{display:flex;flex-direction:column;gap:12px}
.festnow{display:flex;gap:10px;align-items:center}.festnow img{width:92px;border-radius:10px;flex:none}
.log{max-height:60vh;overflow:auto;font-size:13px;line-height:1.35}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}.log .phase{font-weight:800;color:var(--accent)}.log .fest{font-weight:700}
#zoom{position:fixed;pointer-events:none;z-index:50;width:220px;display:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
#zoom img{width:100%;border-radius:14px;display:block}
.modal{position:fixed;inset:0;background:rgba(30,15,10,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--card);border-radius:22px;padding:22px;width:min(640px,100%);max-height:90vh;overflow:auto}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.tgrid button{display:flex;gap:8px;align-items:center;background:var(--felt);color:var(--ink);text-align:left}
.code{font:700 54px Fredoka,sans-serif;letter-spacing:8px;margin:4px 0 8px}
.seats{list-style:none;padding:0;margin:8px 0}.seats li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.seats li span:last-child{margin-left:auto;color:var(--soft);font-size:14px}
table.sc{width:100%;border-collapse:collapse;margin-top:12px}table.sc td,table.sc th{padding:8px;border-bottom:1px solid var(--line);text-align:right}table.sc td:first-child,table.sc th:first-child{text-align:left}
table.sc tr.win td{font-weight:800;background:light-dark(#fff3c8,#3b3218)}
@media (prefers-reduced-motion:reduce){.cardbox{transition:none}}
</style>
</head>
<body>
<section id="setup">
  <div class="setupcard">
    <div class="logo">Minikin<br>City</div>
    <div class="fan"><img src="img/p3.jpg" alt=""><img src="img/g18.jpg" alt=""><img src="img/b14.jpg" alt=""><img src="img/wg12.jpg" alt=""><img src="img/b19.jpg" alt=""></div>
    <div class="seg" id="tabs" style="margin-top:6px"></div>
    <div class="field"><label class="h" for="pname">Votre nom</label><input id="pname" type="text" value="Moi" maxlength="16"></div>
    <div class="field"><label class="h">Nombre de joueurs</label><div class="seg" id="nseg"></div><p id="nhint" style="margin:6px 0 0;color:var(--soft);font-size:14px"></p></div>
    <div class="field"><label class="h">Extensions</label>
      <label class="check"><input type="checkbox" id="xfest"><div><b>Festivals</b><span>Une fête par manche qui change une règle, et un Nouvel An pour le classement final.</span></div></label>
      <label class="check"><input type="checkbox" id="xwild"><div><b>Wild Friends</b><span>13 animaux ajoutés aux cartes Ville et une carte Récompense grise sans meilleure couleur.</span></div></label>
    </div>
    <div id="soloBox"><button id="start" style="width:100%;font-size:17px">Commencer la partie</button></div>
    <div id="onlineBox">
      <p id="netoff" style="color:var(--accent);font-weight:700">Le jeu en ligne n’est pas disponible dans cette version : ouvrez la version publiée sur GitHub.</p>
      <button id="create" style="width:100%;font-size:17px">Créer une salle</button>
      <div style="display:flex;gap:8px;margin-top:10px"><input id="rcode" type="text" placeholder="Code de la salle" maxlength="5" style="text-transform:uppercase"><button id="join" class="ghost" style="flex:none">Rejoindre</button></div>
      <p id="netmsg" style="color:var(--soft);font-size:14px;min-height:20px"></p>
    </div>
  </div>
</section>

<section id="lobby" style="display:none;min-height:100vh;place-items:center;padding:24px">
  <div class="setupcard"><div class="logo" style="font-size:36px">Salle de jeu</div><div id="lobbyBody"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button id="lobbyStart">Lancer la partie</button><button class="ghost" id="lobbyCopy">Copier le lien</button><button class="ghost" id="lobbyLeave">Quitter</button></div></div>
</section>

<section id="game">
  <div class="top"><span class="logo">Minikin City</span><span class="status" id="status"></span><button class="ghost" id="newg">Nouvelle partie</button></div>
  <div class="wrap">
    <main>
      <div class="year" id="year"></div>
      <div class="prompt" id="prompt"></div>
      <div class="mid">
        <div class="zone"><h3>Cartes jouées <small id="bestc"></small></h3><div class="row plays" id="plays"></div></div>
        <div class="zone"><h3>Offre <small id="deckc"></small></h3><div class="row" id="display"></div></div>
      </div>
      <div class="zone me"><h3 id="mehead"></h3><div class="stats" id="mestats"></div>
        <div class="row" id="mycity" style="min-height:40px"></div>
        <h3 style="margin-top:14px">Votre main <small>(survolez une carte pour l’agrandir)</small></h3><div class="row" id="myhand"></div>
      </div>
      <div class="opps" id="opps"></div>
    </main>
    <aside class="side">
      <div class="zone" id="festzone"><h3>Fête en cours</h3><div id="festnow"></div></div>
      <div class="zone"><h3>Journal</h3><div class="log" id="log"></div></div>
    </aside>
  </div>
</section>
<div id="zoom"><img alt=""></div>
<div id="modal"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="net.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
